name: shahid_suleimani_library
description: کتابخانه شهید حاج قاسم سلیمانی
publish_to: 'none'
version: 2.0.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # ==================== State Management ====================
  provider: ^6.1.2
  flutter_riverpod: ^2.5.1

  universal_downloader: ^1.1.2

  # ==================== Local Database ====================
  sqflite: ^2.3.3
  path: ^1.9.0

  # ==================== Animation ====================
  flutter_animate: ^4.5.0
  animations: ^2.0.11
  animate_do: ^3.3.4
  lottie: ^3.1.2

  # ==================== UI / Fonts ====================
  google_fonts: ^6.2.1

  # ==================== Avatar ====================
  dicebear_core: ^10.7.0
  dicebear_styles: ^10.0.0
  flutter_svg: ^2.0.9

  # ==================== PDF Viewer ====================
  pdfrx: ^1.0.78
  pdf_viewer_pro: ^0.0.1

  # ==================== Audio Player ====================
  just_audio: ^0.9.40
  audio_session: ^0.1.21
  just_audio_background: ^0.0.1-beta.13

  # ==================== Video Player ====================
  awesome_video_player: ^1.0.5

  # ==================== Offline Sync ====================
  connectivity_plus: ^6.0.5
  workmanager: ^0.5.2
  background_fetch: ^1.3.7
  
  flutter_local_notifications: ^17.2.3

  # ==================== Rating ====================
  awesome_rating: ^0.0.4

  # ==================== Profile ====================
  image_picker: ^1.1.2

  # ==================== Networking ====================
  http: ^1.2.2

  # ==================== Utilities ====================
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  uuid: ^4.5.1
  path_provider: ^2.1.4
  package_info_plus: ^8.1.0
  url_launcher: ^6.3.1
  wakelock_plus: ^1.2.8
  screen_protector: ^1.4.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/
